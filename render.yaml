services:
  - type: web
    name: api-cine-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_API_URL
        value: https://api-cine-backend.onrender.com

  - type: web
    name: api-cine-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - render.yaml
        - swagger-spec.yml
        - src/**
        - tests/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: https://api-cine-frontend.onrender.com,http://localhost:3000,http://localhost:5173
