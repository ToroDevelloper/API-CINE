name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 24h
      MONGODB_URI: mongodb://127.0.0.1:27017/api_cine_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:ci

      - name: Run tests coverage
        run: pnpm run test:coverage

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint
        working-directory: ./frontend

      - name: Run tests
        run: pnpm run test
        working-directory: ./frontend

      - name: Run tests coverage
        run: pnpm run test:coverage
        working-directory: ./frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: ./frontend

  cd-deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Production Webhook
        run: |
          if [ -n "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}" ]; then
            curl -X POST -H "Content-Type: application/json" -d '{"event":"deploy"}' ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
          else
            echo "No webhook secret defined, skipping deploy trigger"
          fi
